name: Build macOS binaries of FacetBrowser Engine
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (arm64)
    uses: ./.github/workflows/building.yml
    with:
      arch: arm64
      # GitHub's own Apple Silicon runner; upstream builds on Depot
      os: macos-26
